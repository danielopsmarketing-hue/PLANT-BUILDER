<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPS Group Plant Builder — Set your password</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="brand auth-brand">
      <div class="brand-mark">OPS</div>
      <div class="brand-text">
        <div class="brand-name">OPS Group</div>
        <div class="brand-tagline">Plant Builder</div>
      </div>
    </div>

    <h1 class="auth-title">Set your password</h1>
    <p id="invite-greeting" class="auth-subtitle">Checking your invitation link&hellip;</p>
    <div id="auth-error" class="auth-error hidden"></div>

    <form id="set-password-form" class="hidden">
      <div class="field-row">
        <label for="field-password">Password</label>
        <input type="password" id="field-password" required autocomplete="new-password" minlength="8" />
      </div>
      <div class="field-row">
        <label for="field-password-confirm">Confirm password</label>
        <input type="password" id="field-password-confirm" required autocomplete="new-password" minlength="8" />
      </div>
      <button type="submit" class="primary auth-submit">Set password &amp; log in</button>
    </form>
  </div>

  <script type="module" src="js/set-password.js"></script>
</body>
</html>
